name: Playwright Daily Tests

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: "0 13 * * *"  # 13:00 UTC daily (adjust if you want)

permissions:
  contents: read
  pages: write       # needed by deploy job
  id-token: write    # needed by deploy job

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers & OS deps
        run: |
          playwright install --with-deps

      - name: Run tests (pytest produces HTML + Allure)
        run: |
          pytest
        continue-on-error: true  # still publish reports even if tests fail

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html
          path: test_cases/reports/report.html

      - name: Upload Allure results (JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: test_cases/reports/allure

      - name: Upload screenshots/videos/traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: |
            test_cases/Screenshots
            test_cases/videos
            test_cases/reports/traces
          if-no-files-found: ignore

  publish-allure:
    needs: test
    runs-on: ubuntu-latest
    # these permissions are already set at workflow top; kept here for clarity
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Allure results from previous job
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: ./allure-results

      # Build Allure HTML (no Java install needed)
      - name: Generate Allure report
        uses: simple-elf/allure-report-action@v1.7
        with:
          allure_results: ./allure-results
          allure_report: ./allure-report
          keep_reports: 20

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./allure-report

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
